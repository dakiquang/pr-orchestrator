# Copy thành `.pr-orchestrator.yml` ở gốc repo khi cần ghi đè.
# Mọi field đều tuỳ chọn. Thiếu field → skill tự khám phá, không lấy giá trị ví dụ bên dưới làm lệnh thật.
# Giá trị lệnh bên dưới là placeholder, không phải mặc định của một repo.

repo: "" # owner/name; trống = suy từ git remote hoặc URL PR
language: vi
voice: "a/anh" # người nói / cách gọi tác giả PR; không áp cho PR của chính mình
self_logins: [] # login gh khác của chính mình; cộng với các login trong `gh auth status`

audit:
  via: auto # auto | omp | orca; chỉ dùng khi mode: two
  mode: parent_plus_one # parent_plus_one (mặc định: luồng chính + 1 auditor phụ) | two (hai auditor riêng)
  secondary_cli: codex # CLI của auditor phụ trong parent_plus_one
  secondary_model: "" # model id truyền bằng -m; trống = key `model` trong config.toml của Codex
  codex_ignore_user_config: false # true = thêm --ignore-user-config: khởi động nhanh hơn, bỏ provider/profile của người dùng
  models: [] # đúng hai selector khác họ model; chỉ dùng khi mode: two; trống = khám phá

commands:
  test: ""
  typecheck: ""
  lint: ""

rubric:
  correctness: 35
  requirements: 25
  quality: 15
  tests: 15
  scope: 10

merge:
  min_score: 8.0
  method: "" # trống = hỏi hoặc lấy method repo cho phép
  require_ci: false

commit_convention_doc: "" # path tài liệu convention trong repo, nếu có
forbid_ai_attribution: true
issue_tracker: "" # linear | jira | github | none | trống = nhận từ link trong PR
protected_paths: [] # prefix không được sửa; không có danh sách mặc định
